<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>ぽちっと反射神経</title>
<style>
:root{
  --bg:#0d1220; --bg2:#151c2f; --card:#1b2338; --line:#2a3552; --ink:#f2f5fb; --sub:#8e9ab5;
  --go:#22d07a; --go-d:#17a35f; --stop:#ff4b55; --stop-d:#c9343d; --wait:#e8394a; --amber:#ffb020; --blue:#3d8bff;
  --gold:#ffd166;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP",system-ui,-apple-system,sans-serif;
  --num:"SF Pro Rounded",ui-rounded,"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none;overflow:hidden}
html[data-pad=wait],html[data-pad=wait] body{background:var(--wait)}
html[data-pad=go],html[data-pad=go] body{background:var(--go)}
html[data-pad=fly],html[data-pad=fly] body{background:var(--amber)}
html[data-pad=show],html[data-pad=show] body{background:var(--blue)}
html[data-pad=neutral],html[data-pad=neutral] body{background:var(--bg2)}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto}
@media (min-width:700px){#app{zoom:1.45}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px)}
.screen.on{display:flex}
.screen>*{flex-shrink:0}
body.has-banner .screen.bannered{padding-bottom:calc(env(safe-area-inset-bottom) + 76px)}

/* ---------- home ---------- */
.logo{text-align:center;margin:14px 0 2px}
.logo .mk{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:30px;letter-spacing:.04em}
.logo .dot{width:22px;height:22px;border-radius:50%;background:var(--go);box-shadow:0 0 18px var(--go)}
.tag{text-align:center;color:var(--sub);font-size:13px;margin-bottom:16px}
.agecard{background:linear-gradient(135deg,#1f2a47,#18203a);border:1px solid var(--line);border-radius:18px;padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.agecard .l{font-size:12px;color:var(--sub)}
.agecard .v{font-family:var(--num);font-size:34px;font-weight:800;line-height:1.1}
.agecard .v small{font-size:15px;margin-left:2px;color:var(--sub);font-weight:700}
.agecard .r{text-align:right;font-size:12px;color:var(--sub);line-height:1.7}
.agecard .r b{color:var(--ink);font-size:16px;font-family:var(--num)}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:14px;margin:0 0 12px;color:var(--ink);font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #0a0e19}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 #0a0e19}
.mode .ic{flex:none;width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.mode .ic img{width:48px;height:48px;display:block}
.mode .t{font-weight:800;font-size:17px}
.mode .d{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.45}
.mode .best{margin-left:auto;text-align:right;font-size:11px;color:var(--sub);flex:none}
.mode .best b{display:block;font-family:var(--num);font-size:18px;color:var(--ink)}
.ic.simple{background:rgba(34,208,122,.15);color:var(--go)}
.ic.gonogo{background:rgba(255,75,85,.15);color:var(--stop)}
.ic.numbers{background:rgba(61,139,255,.15);color:var(--blue)}
.ic.color{background:rgba(255,176,32,.15);color:var(--amber)}
.ic.hue{background:rgba(160,96,255,.15);color:#b48cff}
.ic.memory{background:rgba(255,200,60,.15);color:#ffd34d}
.hsec{font-size:12px;color:var(--sub);margin:6px 2px 8px;font-weight:700;letter-spacing:.06em}
/* hue / memory */
.tinfo{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:12px;min-height:18px}
.tinfo b{color:var(--ink);font-family:var(--num);font-size:15px}
.tinfo.watch{color:#ffd34d}.tinfo.go{color:var(--go)}
.tgrid{display:grid;gap:7px;width:min(86vw,56vh,400px);aspect-ratio:1;touch-action:none}
.tgrid i{display:block;border-radius:12px;cursor:pointer}
.tgrid.n6 i,.tgrid.n7 i,.tgrid.n8 i{border-radius:7px}
.tgrid.mem i{background:var(--card);border:1px solid var(--line);transition:background .1s,box-shadow .1s}
.tgrid.mem i.lit{background:#ffd34d;border-color:#ffd34d;box-shadow:0 0 22px rgba(255,211,77,.6)}
.tgrid.mem i.tap{background:var(--go);border-color:var(--go)}
.tgrid i.ans{outline:4px solid #fff;outline-offset:-2px}
.tgrid.mem i.ans{background:transparent;outline:3px dashed #ffd34d}
.tgrid i.miss{outline:4px solid var(--stop);outline-offset:-2px}
.tgrid.mem i.miss{background:var(--stop)}
.hearts{font-size:14px;letter-spacing:2px}
.navrow{display:flex;gap:10px;margin-top:4px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;font-family:inherit;
  color:#062314;background:var(--go);box-shadow:0 4px 0 var(--go-d);cursor:pointer;margin:8px 0}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--go-d)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 #0a0e19;border:1px solid var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 #0a0e19}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 #2a63bd}
.navrow .btn{flex:1;margin:0}
.streak{text-align:center;font-size:12px;color:var(--sub);margin:14px 0 4px}
.streak b{color:var(--amber)}

/* 今日のチャレンジ */
.chcard{background:linear-gradient(135deg,#2a2240,#1b2338);border:1px solid #4a3d6e;border-radius:20px;padding:14px 14px 10px;margin-bottom:14px}
.chtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.chtag{display:inline-block;background:var(--amber);color:#3a2600;font-weight:900;font-size:13px;border-radius:8px;padding:3px 9px}
.chday{font-size:11px;color:var(--sub)}
.chmain{display:flex;align-items:center;gap:12px}
.chmain .ic{flex:none;width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.chmain .ic img{width:48px;height:48px}
.chmain .t{font-weight:900;font-size:18px}.chmain .d{font-size:12px;color:var(--sub);margin-top:2px}
.chstat{font-size:12px;color:var(--sub);margin:10px 0 6px}.chstat b{color:var(--ink);font-family:var(--num);font-size:16px}
.chbars{display:flex;gap:6px;align-items:flex-end;height:46px;margin:0 0 8px}
.chbars .cb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.chbars .cb i{display:block;width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:linear-gradient(#ffb020,#ff8a3d)}
.chbars .cb span{font-size:9px;color:var(--sub);margin-top:2px}
.chcard .navrow .btn{padding:13px 8px;font-size:15px}
.howto .chtag{margin-bottom:12px}
.chvar{font-weight:900;font-size:16px;color:var(--amber);margin:-2px 0 10px}.chvar span{font-size:12px;color:var(--sub);font-weight:700}
.gcline{text-align:center;font-size:14px;color:var(--sub);margin:8px 0 2px;min-height:20px}
.gcline b{color:var(--gold);font-family:var(--num);font-size:17px}.gcline a{color:var(--blue);text-decoration:underline;cursor:pointer}
#modal p img{-webkit-touch-callout:default;user-select:auto}

/* ---------- play ---------- */
#play{padding:0;overflow:hidden}
#pad{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  touch-action:none;cursor:pointer;background:var(--bg2);transition:none;padding:0 24px}
#pad.wait{background:var(--wait)}
#pad.go{background:var(--go)}
#pad.fly{background:var(--amber)}
#pad.show{background:var(--blue)}
#pad.neutral{background:var(--bg2)}
.ptop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;z-index:5;
  padding:calc(env(safe-area-inset-top) + 8px) 14px 0;pointer-events:none}
.ptop .x{pointer-events:auto;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.28);color:#fff;border:0;font-size:20px;
  font-family:inherit;cursor:pointer}
.ptop .prog{font-family:var(--num);font-weight:800;font-size:15px;background:rgba(0,0,0,.28);padding:7px 12px;border-radius:999px}
.big{font-size:44px;font-weight:900;line-height:1.15;letter-spacing:.02em}
.huge{font-family:var(--num);font-size:76px;font-weight:900;line-height:1}
.huge small{font-size:26px;margin-left:4px}
.hint{font-size:15px;opacity:.85;margin-top:14px;line-height:1.6}
#pad.go .big,#pad.go .hint{color:#04210f}
.dots{display:flex;gap:8px;justify-content:center;margin-top:22px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.25)}
.dots i.on{background:#fff}
.howto{max-width:330px}
.howto .ic{width:72px;height:72px;border-radius:22px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900}
.howto h2{margin:0 0 10px;font-size:24px}
.howto p{color:var(--sub);font-size:14px;line-height:1.7;margin:0 0 20px}
.howto .btn{width:220px;margin:0 auto}
.sig{width:min(62vw,260px);height:min(62vw,260px);border-radius:50%;display:flex;align-items:center;justify-content:center;
  flex-direction:column;font-weight:900;font-size:36px;color:#fff}
.sig.go{background:var(--go);color:#04210f;box-shadow:0 0 40px rgba(34,208,122,.6)}
.sig.stop{background:var(--stop);box-shadow:0 0 40px rgba(255,75,85,.6)}
.sig .mk{font-size:84px;line-height:1}
.fb{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 70px);text-align:center;font-weight:800;font-size:20px;min-height:28px}
.fb.ok{color:var(--go)}.fb.ng{color:var(--stop)}
/* numbers */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(92vw,420px)}
.grid button{aspect-ratio:1;border:0;border-radius:12px;background:var(--card);color:var(--ink);font-family:var(--num);
  font-weight:800;font-size:clamp(20px,6.5vw,30px);box-shadow:0 3px 0 #0a0e19;touch-action:none;cursor:pointer;padding:0}
.grid button.done{opacity:.15;box-shadow:none}
.grid button.bad{background:var(--stop)}
.ntop{font-family:var(--num);font-size:40px;font-weight:900;margin-bottom:6px}
.nnext{color:var(--sub);font-size:14px;margin-bottom:16px}
.nnext b{color:var(--blue);font-size:18px}
/* color */
.cword{font-size:72px;font-weight:900;margin-bottom:28px;min-height:90px;line-height:90px}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(88vw,380px)}
.cbtns button{height:96px;border:0;border-radius:18px;font-family:inherit;font-weight:900;font-size:22px;color:#fff;touch-action:none;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.cbar{width:min(88vw,380px);height:8px;border-radius:4px;background:var(--card);margin-bottom:22px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--amber);width:100%}

/* ---------- result ---------- */
.rmode{text-align:center;color:var(--sub);font-size:14px;margin-top:10px}
.rval{text-align:center;font-family:var(--num);font-weight:900;font-size:74px;line-height:1.05;margin:6px 0 0}
.rval small{font-size:24px;margin-left:4px;color:var(--sub)}
.newrec{display:block;width:max-content;margin:6px auto 0;background:var(--gold);color:#3a2a00;font-weight:900;font-size:12px;padding:4px 10px;border-radius:999px}
.rank{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 6px}
.rank .g{width:86px;height:86px;display:flex;align-items:center;justify-content:center;font-family:var(--num);
  font-weight:900;font-size:30px;color:#fff;background-size:contain;background-repeat:no-repeat;background-position:center;
  text-shadow:0 1px 0 rgba(0,0,0,.6),0 0 6px rgba(0,0,0,.6);padding-top:4px}
.rank .g.gSS{background-image:url(img/rank_ss.png);padding-top:18px}.rank .g.gS{background-image:url(img/rank_s.png)}
.rank .g.gA{background-image:url(img/rank_a.png)}.rank .g.gB{background-image:url(img/rank_b.png)}
.rank .g.gC{background-image:url(img/rank_c.png)}.rank .g.gD{background-image:url(img/rank_d.png)}
.rank .g.gSS,.rank .g.gS{color:#3a2a00;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.rank .tt{font-weight:900;font-size:20px}
.rank .pc{font-size:13px;color:var(--sub);margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stats span{display:block;font-size:11px;color:var(--sub)}
.stats b{font-family:var(--num);font-size:22px}
.trials{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0 4px}
.trials span{font-family:var(--num);font-size:13px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--sub)}
.trials span.best{color:var(--go);border-color:var(--go)}
.trials span.err{color:var(--stop);border-color:var(--stop)}
.note{font-size:11px;color:var(--sub);text-align:center;margin:6px 0 2px;line-height:1.6}
.badgepop{text-align:center;color:var(--gold);font-weight:800;font-size:14px;margin:6px 0}

/* ---------- records / settings ---------- */
.hdr{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.hdr .back{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:18px;cursor:pointer;font-family:inherit}
.hdr h2{margin:0;font-size:20px}
.sec{font-size:12px;color:var(--sub);margin:16px 0 8px;font-weight:700;letter-spacing:.06em}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 6px}
.chart svg{display:block;width:100%;height:150px}
.chart .empty{height:150px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;min-height:92px}
.badge .e{height:40px;display:flex;justify-content:center}
.badge .e img{width:40px;height:40px;filter:grayscale(1);opacity:.28}
.badge .n{font-size:11px;font-weight:800;margin-top:4px}
.badge .c{font-size:10px;color:var(--sub);margin-top:2px;line-height:1.35}
.badge.got{border-color:var(--gold)}
.badge.got .e img{filter:none;opacity:1}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer;color:var(--ink);text-decoration:none}
.item:last-child{border-bottom:0}
.item span{color:var(--sub);font-size:13px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--go)}.sw.on::after{left:23px}
.ver{text-align:center;color:var(--sub);font-size:11px;margin-top:16px}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
#modal.on{display:flex}
#modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:340px;width:100%}
#modal h3{margin:0 0 8px;font-size:18px}
#modal p{margin:0 0 14px;color:var(--sub);font-size:14px;line-height:1.6;white-space:pre-line}
#modal .row{display:flex;gap:8px}#modal .row .btn{margin:0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">

<!-- ===== HOME ===== -->
<section class="screen bannered on" id="home">
  <div class="logo"><span class="mk"><span class="dot"></span>ぽちっと反射神経</span></div>
  <div class="tag">反射神経・色彩感覚・記憶力。あなたの「目と脳」は何ランク？</div>
  <div class="chcard" id="chCard"></div>
  <div class="agecard" id="ageCard"></div>
  <div class="hsec">反射神経</div>
  <button class="mode" data-mode="simple"><div class="ic simple"><img src="img/mode_simple.png" alt=""></div><div><div class="t">反応速度テスト</div><div class="d">緑になった瞬間にタップ。<br>5回の平均で判定</div></div><div class="best" id="best-simple"></div></button>
  <button class="mode" data-mode="gonogo"><div class="ic gonogo"><img src="img/mode_gonogo.png" alt=""></div><div><div class="t">がまんテスト</div><div class="d">緑の●はタップ、赤の■はがまん。<br>速さと判断力を同時に</div></div><div class="best" id="best-gonogo"></div></button>
  <button class="mode" data-mode="color"><div class="ic color"><img src="img/mode_color.png" alt=""></div><div><div class="t">色ことばテスト</div><div class="d">文字の「色」を選べ。<br>脳がだまされる20問</div></div><div class="best" id="best-color"></div></button>
  <button class="mode" data-mode="numbers"><div class="ic numbers"><img src="img/mode_numbers.png" alt=""></div><div><div class="t">数字タッチ</div><div class="d">1から25まで順番にタッチ。<br>視野の広さと集中力</div></div><div class="best" id="best-numbers"></div></button>
  <div class="hsec">目と記憶</div>
  <button class="mode" data-mode="hue"><div class="ic hue"><img src="img/mode_hue.png" alt=""></div><div><div class="t">色彩感覚テスト <span style="font-size:10px;background:var(--amber);color:#3a2600;border-radius:6px;padding:1px 5px;vertical-align:2px">NEW</span></div><div class="d">1つだけ色がちがうマスを探せ。<br>色の差はどんどん小さくなる</div></div><div class="best" id="best-hue"></div></button>
  <button class="mode" data-mode="memory"><div class="ic memory"><img src="img/mode_memory.png" alt=""></div><div><div class="t">記憶力テスト <span style="font-size:10px;background:var(--amber);color:#3a2600;border-radius:6px;padding:1px 5px;vertical-align:2px">NEW</span></div><div class="d">光った順番どおりにタップ。<br>1つずつ長くなる</div></div><div class="best" id="best-memory"></div></button>
  <div class="navrow"><button class="btn ghost" id="bRecords">📈 記録・バッジ</button><button class="btn ghost" id="bSettings">⚙️ 設定</button></div>
  <div class="streak" id="streak"></div>
</section>

<!-- ===== PLAY ===== -->
<section class="screen" id="play">
  <div id="pad"></div>
  <div class="ptop"><button class="x" id="bQuit" aria-label="やめる">✕</button><div class="prog" id="prog"></div></div>
</section>

<!-- ===== RESULT ===== -->
<section class="screen bannered" id="result">
  <div id="rCh"></div>
  <div class="rmode" id="rMode"></div>
  <div class="rval" id="rVal"></div>
  <div id="rNew"></div>
  <div class="rank" id="rRank"></div>
  <div class="stats" id="rStats"></div>
  <div class="trials" id="rTrials"></div>
  <div class="badgepop" id="rBadge"></div>
  <div class="gcline" id="rGc"></div>
  <div class="note" id="rNote"></div>
  <button class="btn" id="bAgain">もう一度</button>

<script src="native.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const now=()=>performance.now();
// 乱数。ふだんは Math.random、今日のチャレンジ中は「日付で決まる乱数」に差し替えて全員同じ問題にする
let R=Math.random;
function seeded(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=(a,b)=>a+R()*(b-a);
const shuffle=(a,rng)=>{rng=rng||R;for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- 保存データ ---------- */
const KEY='pr_save_v1';
const DEF={sound:true,haptic:true,best:{},hist:{simple:[],gonogo:[],color:[],numbers:[],hue:[],memory:[]},plays:0,badges:{},
  lastDay:'',streak:0,lastAge:null,bestTrial:null,doneSinceAd:0,ch:null};
let S;
try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){S=Object.assign({},DEF);}
S.hist=Object.assign({simple:[],gonogo:[],color:[],numbers:[],hue:[],memory:[]},S.hist||{});
S.ch=Object.assign({day:-1,tries:0,best:null,bestV:null,log:{},streak:0,last:-99},S.ch||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- モード定義 ----------
 * mean/sd: スマホのタッチ操作を前提にした目安の分布。上位%の計算に使う(正規分布近似)。
 * 値が小さいほど良い。hi:true のモード(色彩感覚・記憶力)だけは値が大きいほど良い。      */
const MODES={
  simple:{name:'反応速度テスト',unit:'ms',mean:300,sd:45,icon:'⚡',cls:'simple'},
  gonogo:{name:'がまんテスト',unit:'ms',mean:420,sd:70,icon:'✋',cls:'gonogo'},
  color:{name:'色ことばテスト',unit:'ms',mean:900,sd:170,icon:'色',cls:'color'},
  numbers:{name:'数字タッチ',unit:'秒',mean:21,sd:4.5,icon:'25',cls:'numbers'},
  hue:{name:'色彩感覚テスト',unit:'ステージ',mean:17,sd:6,cls:'hue',hi:true},
  memory:{name:'記憶力テスト',unit:'個',mean:9,sd:3,cls:'memory',hi:true},
};
const better=(m,a,b)=>MODES[m].hi?a>b:a<b;
const fmt=(m,v)=>m==='numbers'?v.toFixed(2):String(Math.round(v));

function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+.3275911*x);
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return s*y;}
function topPct(m,v){const M=MODES[m];let p=.5*(1+erf((v-M.mean)/(M.sd*Math.SQRT2)));if(M.hi)p=1-p;return clamp(p*100,.1,99.9);}
const pctTxt=p=>p<1?p.toFixed(1):String(Math.round(p));
const RANK_HI={SS:'神の領域',S:'達人級',A:'かなり鋭い',B:'ふつう',C:'もう少し',D:'これから'};
function rankOf(p,m){
  const r=rankOf0(p);if(m&&MODES[m].hi)r.t=RANK_HI[r.g];return r;
}
function rankOf0(p){
  if(p<=2)return{g:'SS',t:'人間やめてる'};
  if(p<=10)return{g:'S',t:'アスリート級'};
  if(p<=30)return{g:'A',t:'かなり速い'};
  if(p<=60)return{g:'B',t:'ふつう'};
  if(p<=85)return{g:'C',t:'ちょっと遅め'};
  return{g:'D',t:'おねむ'};
}
// 反射神経年齢(お遊び): 平均反応速度から換算
function ageOf(ms){return Math.round(clamp(20+(ms-250)/2.5,8,80));}
function ageLabel(a){return a<=9?'1ケタ':a<20?'10代':a<30?'20代':a<40?'30代':a<50?'40代':a<60?'50代':a<70?'60代':'70代以上';}

/* ---------- 効果音 / 振動 ---------- */
let AC=null;
function beep(f,d,type,vol){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(vol||.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const sfx={tap:()=>beep(660,.06,'triangle',.08),ok:()=>beep(880,.09,'sine'),ng:()=>beep(160,.22,'square',.07),
  fly:()=>beep(220,.25,'sawtooth',.06),fin:()=>{beep(660,.1);setTimeout(()=>beep(990,.16),110);}};
function buzz(kind){if(S.haptic)Native.haptic(kind);}

/* ---------- UI共通 ---------- */
function show(id){if(id!=='play')delete document.documentElement.dataset.pad;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));updateBanner();}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800);}
function modal(title,body,ok,cancel,okLabel){
  $('mTitle').textContent=title;$('mBody').textContent=body||'';const row=$('mRow');row.innerHTML='';
  if(cancel){const c=document.createElement('button');c.className='btn ghost';c.textContent='キャンセル';c.onclick=()=>{$('modal').classList.remove('on');cancel();};row.appendChild(c);}
  const b=document.createElement('button');b.className='btn';b.textContent=okLabel||'OK';b.onclick=()=>{$('modal').classList.remove('on');ok&&ok();};row.appendChild(b);
  $('modal').classList.add('on');
}
window.modal=modal;
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}

/* ---------- HOME ---------- */
function renderHome(){
  const a=S.lastAge;
  $('ageCard').innerHTML=a==null
    ? `<div><div class="l">あなたの反射神経年齢</div><div class="v">？<small>歳</small></div></div><div class="r">反応速度テストで<br>測定しよう</div>`
    : `<div><div class="l">あなたの反射神経年齢</div><div class="v">${a}<small>歳</small></div></div><div class="r">プレイ回数 <b>${S.plays}</b><br>ベスト <b>${S.best.simple!=null?Math.round(S.best.simple)+'ms':'—'}</b></div>`;
  for(const m in MODES){const b=S.best[m];$('best-'+m).innerHTML=b==null?'未プレイ':`ベスト<b>${fmt(m,b)}${MODES[m].unit}</b>`;}
  renderChCard();
  $('streak').innerHTML=S.streak>1?`🔥 <b>${S.streak}日連続</b>でプレイ中`:'毎日測って、反射神経の変化をチェック';
  show('home');
}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{sfx.tap();startMode(b.dataset.mode);});
$('bRecords').onclick=()=>{sfx.tap();openRecords();};
$('bSettings').onclick=()=>{sfx.tap();renderSettings();show('settings');};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{sfx.tap();renderHome();});

/* =========================================================
 *  PLAY
 * ========================================================= */
const pad=$('pad');
let G=null;          // 現在のゲーム状態
let timers=[];
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t;}
function clearTimers(){timers.forEach(clearTimeout);timers=[];if(G&&G.raf)cancelAnimationFrame(G.raf);}
// iPadなど#appより画面が広いとき、余白も測定画面と同じ色にする
function setPad(cls,html){pad.className=cls||'';pad.innerHTML=html||'';document.documentElement.dataset.pad=cls||'neutral';}
function setProg(t){$('prog').textContent=t||'';$('prog').style.visibility=t?'visible':'hidden';}

/* 刺激が「画面に出た時刻」を取る。
 * 状態を変えた直後の requestAnimationFrame はその変更が描画されるフレームの開始時刻。 */
function markShown(cb){G.raf=requestAnimationFrame(t=>{cb(t);});}
/* タップ時刻: event.timeStamp は performance.now() と同じ基準(高精度)。おかしければ現在時刻 */
function tapTime(e){const t=e&&e.timeStamp,n=now();return(t&&t>n-1000&&t<=n+1)?t:n;}

$('bQuit').onclick=e=>{e.stopPropagation();sfx.tap();clearTimers();G=null;R=Math.random;renderHome();};
pad.addEventListener('pointerdown',e=>{e.preventDefault();if(G&&G.onPad)G.onPad(e);},{passive:false});

function startMode(m,ch){
  clearTimers();R=Math.random;
  G={mode:m,ch:ch||null,v:ch?ch.v:null};
  show('play');setProg('');
  const M=MODES[m];
  const texts={
    simple:['反応速度テスト','画面が<b style="color:var(--go)">緑</b>に変わった瞬間に、どこでもいいのでタップ。<br>赤のうちに押すとフライング。5回の平均で判定します。'],
    gonogo:['がまんテスト','<b style="color:var(--go)">緑の●</b>が出たらすぐタップ。<br><b style="color:var(--stop)">赤の■</b>のときはタップせずにがまん。<br>12問。ミス1回につき+100msのペナルティ。'],
    color:['色ことばテスト','「あか」「あお」などの文字が出ます。<br>文字の<b>意味ではなく、文字の色</b>のボタンを押してください。<br>20問。ミス1回につき+300msのペナルティ。'],
    numbers:['数字タッチ','1から25まで、順番にできるだけ速くタッチ。<br>まちがえると+1秒。'],
    hue:['色彩感覚テスト','並んだマスの中から、<b>1つだけ色がちがうマス</b>をタップ。<br>ステージが進むほど色の差が小さくなります。<br>まちがえるか10秒たつとライフが1つ減ります（ライフ3）。'],
    memory:['記憶力テスト','マスが1つずつ<b style="color:#ffd34d">光ります</b>。<br>光った順番どおりにタップしてください。<br>成功するたびに1つ長くなります。まちがえるとライフが1つ減ります（ライフ3）。'],
  }[m];
  const chHead=ch?`<div class="chtag">今日のチャレンジ #${ch.no}</div>`:'';
  const chNote=ch?`<div class="chvar">${ch.v.name}${ch.v.desc?'<br><span>'+ch.v.desc+'</span>':''}</div><p style="margin-top:-6px">全員が同じ問題。1日${CH_TRIES}回まで挑戦でき、いちばん良い記録が今日の記録になります（あと${CH_TRIES-S.ch.tries}回）。</p>`:'';
  setPad('neutral',`<div class="howto">${chHead}<div class="ic ${M.cls}"><img src="img/mode_${m}.png" alt="" style="width:64px;height:64px"></div><h2>${texts[0]}</h2>${chNote}<p>${texts[1]}</p><button class="btn" id="bStart">スタート</button></div>`);
  G.onPad=null;
  $('bStart').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();sfx.tap();
    R=ch?seeded(ch.seed+S.ch.tries*7919):Math.random; // チャレンジは「何回目か」ごとに全員同じ問題
    ({simple:simpleStart,gonogo:gngStart,color:colorStart,numbers:numStart,hue:hueStart,memory:memStart})[m]();},{passive:false});
}

/* ---------- 1. 反応速度テスト ---------- */
const SIMPLE_N=5;
function simpleStart(){Object.assign(G,{rts:[],fly:0,n:(G.v&&G.v.n)||SIMPLE_N});simpleWait();}
function dots(n,done){let h='<div class="dots">';for(let i=0;i<n;i++)h+=`<i class="${i<done?'on':''}"></i>`;return h+'</div>';}
function simpleWait(){
  setProg(`${G.rts.length+1} / ${G.n}`);
  G.state='wait';
  setPad('wait',`<div class="big">待って…</div><div class="hint">緑になったらタップ</div>${dots(G.n,G.rts.length)}`);
  later(()=>{
    if(!G||G.state!=='wait')return;
    G.state='go';G.goT=null;
    setPad('go',`<div class="big">タップ！</div>`);
    markShown(t=>{if(G)G.goT=t;});
  },rnd(1400,4200));
  G.onPad=simplePad;
}
function simplePad(e){
  const t=tapTime(e);
  if(G.state==='wait'){
    clearTimers();G.fly++;G.state='fly';sfx.fly();buzz('heavy');
    setPad('fly',`<div class="big">フライング！</div><div class="hint">緑になるまで待ってね<br>タップでやり直し</div>`);
    G.onPad=()=>{if(G.state==='fly')simpleWait();};
    return;
  }
  if(G.state==='go'){
    const go=G.goT!=null?G.goT:t;
    const rt=t-go;
    if(rt<100){ // 人間の反応としては速すぎる=見込み押し
      clearTimers();G.fly++;G.state='fly';sfx.fly();
      setPad('fly',`<div class="big">見込み押し！</div><div class="hint">100ms未満は予測で押したとみなします<br>タップでやり直し</div>`);
      G.onPad=()=>{if(G.state==='fly')simpleWait();};return;
    }
    G.rts.push(rt);G.state='show';sfx.ok();buzz('light');
    const last=G.rts.length>=G.n;
    setPad('show',`<div class="huge">${Math.round(rt)}<small>ms</small></div><div class="hint">${last?'タップで結果へ':'タップで次へ'}</div>${dots(G.n,G.rts.length)}`);
    G.onPad=null;
    later(()=>{G.onPad=()=>{if(G.state!=='show')return;last?simpleEnd():simpleWait();};},350);
  }
}
function simpleEnd(){
  const avg=G.rts.reduce((a,b)=>a+b,0)/G.rts.length;
  const best=Math.min(...G.rts);
  finish('simple',avg,{
    stats:[['ベスト',Math.round(best)+'ms'],['フライング',G.fly+'回']],
    trials:G.rts.map(v=>({v:Math.round(v),best:v===best})),
    bestTrial:best,
  });
}

/* ---------- 2. がまんテスト (Go/No-Go) ---------- */
const GNG_N=12,GNG_NOGO=4,GNG_LIMIT=1000,GNG_PEN=100;
function gngStart(){
  const ng=(G.v&&G.v.nogo)||GNG_NOGO;
  const seq=shuffle(Array(GNG_N-ng).fill('go').concat(Array(ng).fill('stop')));
  if(seq[0]==='stop'){const i=seq.indexOf('go');[seq[0],seq[i]]=[seq[i],seq[0]];} // 1問目は押せ
  Object.assign(G,{seq,i:0,rts:[],err:0,log:[]});gngNext();
}
function gngNext(){
  if(G.i>=G.seq.length){gngEnd();return;}
  setProg(`${G.i+1} / ${GNG_N}`);
  G.state='wait';
  setPad('neutral',`<div class="sig" style="background:var(--card);box-shadow:none;color:var(--sub);font-size:22px">…</div><div class="fb" id="fb"></div>`);
  G.onPad=gngPad;
  later(()=>{
    if(!G||G.state!=='wait')return;
    const k=G.seq[G.i];G.state=k;G.goT=null;
    setPad('neutral',k==='go'
      ?`<div class="sig go"><div class="mk">●</div>タップ</div><div class="fb" id="fb"></div>`
      :`<div class="sig stop" style="border-radius:28px"><div class="mk">■</div>がまん</div><div class="fb" id="fb"></div>`);
    markShown(t=>{if(G)G.goT=t;});
    later(()=>gngTimeout(k),GNG_LIMIT);
  },rnd(700,1800));
}
function gngFb(t,ok){const f=$('fb');if(f){f.textContent=t;f.className='fb '+(ok?'ok':'ng');}}
function gngAdvance(ms){G.state='between';G.i++;later(gngNext,ms);}
function gngTimeout(k){
  if(!G||G.state!==k)return;
  if(k==='go'){G.err++;G.log.push({v:'遅い',err:true});sfx.ng();gngFb('遅い！',false);}
  else{G.log.push({v:'○',err:false});sfx.ok();gngFb('よく我慢した！',true);}
  gngAdvance(650);
}
function gngPad(e){
  const t=tapTime(e);
  if(G.state==='wait'){clearTimers();G.err++;G.log.push({v:'フライング',err:true});sfx.fly();buzz('heavy');gngFb('フライング！',false);gngAdvance(800);return;}
  if(G.state==='go'){
    clearTimers();const rt=t-(G.goT!=null?G.goT:t);
    if(rt<100){G.err++;G.log.push({v:'見込み',err:true});sfx.fly();gngFb('見込み押し！',false);gngAdvance(800);return;}
    G.rts.push(rt);G.log.push({v:Math.round(rt),err:false});sfx.ok();buzz('light');gngFb(Math.round(rt)+'ms',true);gngAdvance(550);return;
  }
  if(G.state==='stop'){clearTimers();G.err++;G.log.push({v:'押した',err:true});sfx.ng();buzz('heavy');gngFb('がまんできなかった！',false);gngAdvance(800);}
}
function gngEnd(){
  const avg=G.rts.length?G.rts.reduce((a,b)=>a+b,0)/G.rts.length:GNG_LIMIT;
  const score=avg+G.err*GNG_PEN;
  finish('gonogo',score,{
    stats:[['平均反応',Math.round(avg)+'ms'],['ミス',G.err+'回（+'+G.err*GNG_PEN+'ms）']],
    trials:G.log.map(x=>({v:x.v,err:x.err})),
    perfect:G.err===0,
  });
}

/* ---------- 3. 色ことばテスト (ストループ) ---------- */
const COLORS=[{k:'red',w:'あか',c:'#ff4b55'},{k:'blue',w:'あお',c:'#3d8bff'},{k:'green',w:'みどり',c:'#22d07a'},{k:'yellow',w:'きいろ',c:'#ffc61a'}];
const COLOR_N=20,COLOR_PEN=300,COLOR_LIMIT=3000;
const KANJI={red:'赤',blue:'青',green:'緑',yellow:'黄'};
const cw=c=>G&&G.v&&G.v.kanji?KANJI[c.k]:c.w;
function colorStart(){
  Object.assign(G,{i:0,rts:[],err:0,log:[]});
  // ボタン配置はゲーム中固定(毎回変えると探す時間を測ることになる)
  G.order=shuffle(COLORS.slice());
  colorNext();
}
function colorNext(){
  if(G.i>=COLOR_N){colorEnd();return;}
  setProg(`${G.i+1} / ${COLOR_N}`);
  // 3/4 は文字と色が不一致(ここが難しい)
  const word=COLORS[Math.floor(R()*4)];
  let ink=word;
  if(R()<.75){const others=COLORS.filter(c=>c!==word);ink=others[Math.floor(R()*3)];}
  G.cur={word,ink};G.state='wait';
  const btns=G.order.map(c=>`<button data-k="${c.k}" style="background:${c.c};${c.k==='yellow'?'color:#3a2a00':''}">${cw(c)}</button>`).join('');
  setPad('neutral',`<div class="cbar"><i id="cbar"></i></div><div class="cword" id="cword"></div><div class="cbtns" id="cbtns">${btns}</div><div class="fb" id="fb"></div>`);
  G.onPad=null;
  pad.querySelectorAll('#cbtns button').forEach(b=>b.addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();colorPick(b.dataset.k,ev);},{passive:false}));
  later(()=>{
    if(!G||G.state!=='wait')return;
    const w=$('cword');w.textContent=cw(word);w.style.color=ink.c;G.state='go';G.goT=null;
    markShown(t=>{if(G)G.goT=t;});
    const bar=$('cbar');bar.style.transition=`width ${COLOR_LIMIT}ms linear`;requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.width='0%';}));
    later(()=>{if(G&&G.state==='go'){G.state='done';G.err++;G.log.push({v:'遅い',err:true});sfx.ng();gngFb('時間切れ',false);G.i++;later(colorNext,600);}},COLOR_LIMIT);
  },rnd(450,900));
}
function colorPick(k,e){
  if(!G)return;
  if(G.state==='wait'){return;} // 文字が出る前のタップは無視
  if(G.state!=='go')return;
  const t=tapTime(e);clearTimers();G.state='done';
  const rt=t-(G.goT!=null?G.goT:t);
  if(k===G.cur.ink.k){G.rts.push(rt);G.log.push({v:Math.round(rt),err:false});sfx.ok();buzz('light');gngFb(Math.round(rt)+'ms',true);}
  else{G.err++;G.log.push({v:'×',err:true});sfx.ng();buzz('heavy');gngFb(k===G.cur.word.k?'文字に釣られた！':'ちがう色',false);}
  G.i++;later(colorNext,500);
}
function colorEnd(){
  const avg=G.rts.length?G.rts.reduce((a,b)=>a+b,0)/G.rts.length:COLOR_LIMIT;
  const score=avg+G.err*COLOR_PEN;
  finish('color',score,{
    stats:[['平均反応',Math.round(avg)+'ms'],['ミス',G.err+'回（+'+G.err*COLOR_PEN+'ms）']],
    trials:G.log.map(x=>({v:x.v,err:x.err})),
    perfect:G.err===0,
  });
}

function numTap(b,e){

  if(v===G.next){
    b.classList.add('done');G.next+=G.rev?-1:1;beep(500+(G.rev?26-G.next:G.next)*18,.05,'triangle',.07);
    if(G.rev?G.next<1:G.next>25){const t=tapTime(e);G.state='end';cancelAnimationFrame(G.raf);
      const sec=(t-G.t0)/1000+G.miss;$('ntime').textContent=sec.toFixed(2);
      later(()=>finish('numbers',sec,{stats:[['タイム',((t-G.t0)/1000).toFixed(2)+'秒'],['ミス',G.miss+'回（+'+G.miss+'秒）']],trials:[]}),350);
      return;}

/* ---------- 5. 色彩感覚テスト ----------
 * OKLab(見た目の差にほぼ比例する色空間)で基準色を選び、1マスだけ「色の差 d」ずらす。
 * d = max(0.008, 0.22×0.9^(ステージ−1))。画面では ×100 して表示。スコア=クリアしたステージ */
function oklabToLin(L,a,b){
  const l_=L+0.3963377774*a+0.2158037573*b,m_=L-0.1055613458*a-0.0638541728*b,s_=L-0.0894841775*a-1.2914855480*b;
  const l=l_*l_*l_,mm=m_*m_*m_,s=s_*s_*s_;
  return [4.0767416621*l-3.3077115913*mm+0.2309699292*s,-1.2684380046*l+2.6097574011*mm-0.3413193965*s,-0.0041960863*l-0.7034186147*mm+1.7076147010*s];}
const inGamut=c=>c.every(v=>v>=0&&v<=1);
const enc=x=>Math.round((x<=0.0031308?12.92*x:1.055*Math.pow(x,1/2.4)-0.055)*255);
const cssC=c=>'rgb('+c.map(enc).join(',')+')';
const hueDelta=s=>Math.max(0.008,0.22*Math.pow(0.9,s-1));
const hueSize=s=>s<=1?2:s<=3?3:s<=6?4:s<=10?5:s<=15?6:s<=22?7:8;
function huePuzzle(n,d){
  for(let k=0;k<400;k++){
    const L=0.48+R()*0.38,C=0.03+R()*0.14,h=R()*Math.PI*2;
    const a=C*Math.cos(h),b=C*Math.sin(h);
    let dx=(R()*2-1)*0.7,dy=R()*2-1,dz=R()*2-1;const nr=Math.hypot(dx,dy,dz);if(nr<0.2)continue;
    const c1=oklabToLin(L,a,b),c2=oklabToLin(L+d*dx/nr,a+d*dy/nr,b+d*dz/nr);
    if(!inGamut(c1)||!inGamut(c2))continue;
    const s1=cssC(c1),s2=cssC(c2);if(s1===s2)continue;
    return {n,base:s1,odd:s2,idx:Math.floor(R()*n*n),d};
  }
  return {n,base:'rgb(120,120,200)',odd:'rgb(128,120,200)',idx:0,d};
}
const fmtD=d=>(d*100).toFixed(1);
const hearts=(n,max)=>{max=max||3;return '<span class="hearts">'+'❤️'.repeat(n)+'<span style="opacity:.25">'+'❤️'.repeat(Math.max(0,max-n))+'</span></span>';};
function hueStart(){const L=(G.v&&G.v.lives)||3;Object.assign(G,{stage:1,lives:L,maxL:L,score:0,minD:null,miss:0});hueNext();}
function hueNext(){
  if(!G)return;
  const p=huePuzzle(hueSize(G.stage),hueDelta(G.stage));G.p=p;G.state='go';
  setProg(`ステージ ${G.stage}`);
  setPad('neutral',`<div class="tinfo">色の差 <b>${fmtD(p.d)}</b>　${hearts(G.lives,G.maxL)}</div>
    <div class="tgrid n${p.n}" id="tgrid" style="grid-template-columns:repeat(${p.n},1fr)">${Array.from({length:p.n*p.n},(_,i)=>`<i data-i="${i}" style="background:${i===p.idx?p.odd:p.base}"></i>`).join('')}</div>
    <div class="cbar" style="margin:18px 0 0"><i id="cbar"></i></div><div class="fb" id="fb"></div>`);
  pad.querySelectorAll('#tgrid i').forEach(el=>el.addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();huePick(+el.dataset.i);},{passive:false}));
  const bar=$('cbar');bar.style.transition='width 10000ms linear';requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.width='0%';}));
  later(()=>{if(G&&G.state==='go')hueMiss(-1,true);},10000);
}
function huePick(i){
  if(!G||G.state!=='go')return;
  if(i!==G.p.idx){hueMiss(i,false);return;}
  clearTimers();G.state='done';G.score=G.stage;G.minD=G.minD==null?G.p.d:Math.min(G.minD,G.p.d);
  beep(520*Math.pow(1.03,Math.min(G.stage,30)),.09,'sine');buzz('light');gngFb('正解！',true);
  G.stage++;later(hueNext,260);
}
function hueMiss(i,timeout){
  clearTimers();G.state='done';G.lives--;G.miss++;sfx.ng();buzz('heavy');
  const tiles=$('tgrid').children;if(i>=0)tiles[i].classList.add('miss');tiles[G.p.idx].classList.add('ans');
  gngFb(timeout?'時間切れ':'ざんねん',false);
  if(G.lives>0){later(hueNext,1100);return;}
  later(()=>finish('hue',G.score,{stats:[['見抜いた最小の色の差',G.minD!=null?fmtD(G.minD):'—'],['ミス',G.miss+'回']],trials:[]}),1200);
}

/* ---------- 6. 記憶力テスト(順番記憶) ----------
 * 3×3のマスが1つずつ光る。同じ順番でタップ。成功で1つ長くなる(3から)。
 * ミスでライフ-1、同じ順番をもう一度見せる。スコア=覚えられた最長の長さ */
const PENTA=[0,2,4,7,9];
const tileFreq=i=>330*Math.pow(2,(Math.floor(i/5)*12+PENTA[i%5])/12);
const memStep=prev=>{const n=G&&G.gs?G.gs*G.gs:9;let i;do{i=Math.floor(R()*n);}while(i===prev);return i;};
function memStart(){G.gs=(G.v&&G.v.gs)||3;G.seq=[];for(let k=0;k<3;k++)G.seq.push(memStep(G.seq[k-1]));Object.assign(G,{lives:3,score:0,miss:0});memPlay();}
function memPlay(){
  if(!G)return;
  G.state='show';G.pos=0;
  setProg(`長さ ${G.seq.length}`);
  setPad('neutral',`<div class="tinfo watch" id="tinfo">👀 よく見て…　${hearts(G.lives)}</div>
    <div class="tgrid mem" id="tgrid" style="grid-template-columns:repeat(${G.gs},1fr)">${Array.from({length:G.gs*G.gs},(_,i)=>`<i data-i="${i}"></i>`).join('')}</div><div class="fb" id="fb"></div>`);
  pad.querySelectorAll('#tgrid i').forEach(el=>el.addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();memTap(+el.dataset.i,el);},{passive:false}));
  const on=Math.max(300,560-G.seq.length*16),off=Math.round(on*.35);let k=0;
  const step=()=>{if(!G||G.state!=='show')return;
    if(k>=G.seq.length){G.state='input';const t=$('tinfo');t.className='tinfo go';t.innerHTML='👆 同じ順番でタップ　'+hearts(G.lives);return;}
    const i=G.seq[k++],el=$('tgrid').children[i];el.classList.add('lit');beep(tileFreq(i),.22,'triangle',.14);
    later(()=>{el.classList.remove('lit');later(step,off);},on);};
  later(step,650);
}
function memTap(i,el){
  if(!G||G.state!=='input')return;
  if(i!==G.seq[G.pos]){
    clearTimers();G.state='done';G.lives--;G.miss++;sfx.ng();buzz('heavy');
    el.classList.add('miss');$('tgrid').children[G.seq[G.pos]].classList.add('ans');gngFb('ざんねん',false);
    if(G.lives>0){later(memPlay,1400);return;}
    later(()=>finish('memory',G.score,{stats:[['覚えられた最長',G.score+'個'],['ミス',G.miss+'回']],trials:[]}),1400);return;
  }
  G.pos++;beep(tileFreq(i),.22,'triangle',.14);buzz('light');
  el.classList.remove('tap');void el.offsetWidth;el.classList.add('tap');setTimeout(()=>el.classList.remove('tap'),200);
  if(G.pos>=G.seq.length){G.state='done';G.score=G.seq.length;gngFb('クリア！',true);
    G.seq.push(memStep(G.seq[G.seq.length-1]));later(memPlay,850);}
}

/* =========================================================
 *  今日のチャレンジ（日替わり・全員同じ問題）
 *  日本時間の0時に切り替わる。種目×ルール12通りを、12日ごとに順番を入れかえて出す。
 *  1日3回まで挑戦でき、いちばん良いポイントが今日の記録(Game Centerの今日のランキング)。
 * ========================================================= */
const CH_TRIES=3;
const DAY0=Date.UTC(2026,9,27,15,0,0); // 2026-10-28 00:00(日本時間) = #1
const VARIANTS=[
  {m:'simple',name:'5回勝負'},
  {m:'simple',name:'3回の一発勝負',desc:'3回の平均で判定',n:3},
  {m:'gonogo',name:'ふつう'},
  {m:'gonogo',name:'がまん多め',desc:'12問中6問が赤の■',nogo:6,mean:440},
  {m:'color',name:'ひらがな'},
  {m:'color',name:'漢字バージョン',desc:'「赤」「青」の漢字で出題',kanji:true,mean:950},
  {m:'numbers',name:'1→25'},
  {m:'numbers',name:'逆順 25→1',desc:'25から1へ順番にタッチ',rev:true,mean:23},
  {m:'hue',name:'ライフ3'},
  {m:'hue',name:'一発勝負',desc:'ライフ1。1回まちがえたら終わり',lives:1,mean:11,sd:5},
  {m:'memory',name:'3×3マス'},
  {m:'memory',name:'4×4マス',desc:'マスが16個にふえる',gs:4,mean:8,sd:3},
];
function dayIdx(t){return Math.floor(((t||Date.now())-DAY0)/86400000);}
function dayLabel(d){const t=new Date(DAY0+d*86400000+9*3600000);return (t.getUTCMonth()+1)+'/'+t.getUTCDate();}
function chOf(d){
  const blk=Math.floor(d/12),rng=seeded(9973+blk*7919);let order;
  for(let k=0;k<60;k++){ // 同じ種目が2日続かない並びを選ぶ
    order=shuffle(VARIANTS.map((_,i)=>i),rng);
    if(order.every((x,i)=>i===0||VARIANTS[x].m!==VARIANTS[order[i-1]].m))break;
  }
  const v=VARIANTS[order[((d%12)+12)%12]];
  return {d,no:d+1,v,seed:(Math.imul(d+1,2654435761)>>>0)};
}
const todayCh=()=>chOf(dayIdx());
function chPoints(v,val){ // 種目がちがっても比べられるよう、上位%を0〜9990ポイントにする(大きいほど良い)
  const M=MODES[v.m],mean=v.mean||M.mean,sd=v.sd||M.sd;
  let p=.5*(1+erf((val-mean)/(sd*Math.SQRT2)));if(M.hi)p=1-p;p=clamp(p*100,.1,99.9);
  return {pts:Math.round((100-p)*100),p};
}
function chSync(){const d=dayIdx();if(S.ch.day!==d){S.ch.day=d;S.ch.tries=0;S.ch.best=null;S.ch.bestV=null;save();}}
function startChallenge(){
  chSync();
  const c=todayCh();
  if(S.ch.tries>=CH_TRIES){
    modal('今日のチャレンジは終わり','今日は'+CH_TRIES+'回挑戦しました。明日の0時に新しいお題が出ます。\n今日の記録：'+(S.ch.best!=null?S.ch.best+'ポイント':'—'),()=>{},null,'OK');return;}
  startMode(c.v.m,c);
}
function finishChallenge(ch,m,v,extra){
  chSync();
  const M=MODES[m],{pts,p}=chPoints(ch.v,v),r=rankOf(p,m);
  S.ch.tries++;S.plays++;S.doneSinceAd++;
  const isBest=S.ch.best==null||pts>S.ch.best;
  if(isBest){S.ch.best=pts;S.ch.bestV=v;}
  S.ch.log[ch.d]=S.ch.best;
  const keys=Object.keys(S.ch.log).map(Number).sort((a,b)=>b-a);keys.slice(30).forEach(k=>delete S.ch.log[k]);
  if(S.ch.last!==ch.d){S.ch.streak=S.ch.last===ch.d-1?S.ch.streak+1:1;S.ch.last=ch.d;}
  if(Object.keys(MODES).every(k=>S.hist[k].length))S.badges.all=S.badges.all||Date.now();
  save();
  Native.gcSubmit('pr_daily',pts);
  last={m,v,p,r,age:null,ch,pts};
  const left=CH_TRIES-S.ch.tries;
  $('rCh').innerHTML=`<div class="chtag" style="margin-top:6px">今日のチャレンジ #${ch.no}（${dayLabel(ch.d)}）</div>`;
  $('rMode').textContent=M.name+'・'+ch.v.name;
  $('rVal').innerHTML=`${fmt(m,v)}<small>${M.unit}</small>`;
  $('rNew').innerHTML=isBest&&S.ch.tries>1?'<span class="newrec">今日のベスト更新！</span>':'';
  $('rRank').innerHTML=`<div class="g g${r.g}">${r.g}</div><div><div class="tt">${pts.toLocaleString()} <span style="font-size:14px">ポイント</span></div><div class="pc">上位 ${pctTxt(p)}%（目安）</div></div>`;
  const st=extra.stats.slice();
  st.unshift(['今日のベスト',S.ch.best.toLocaleString()+'pt'],['連続参加',S.ch.streak+'日']);
  $('rStats').innerHTML=st.map(([a,b])=>`<div><span>${a}</span><b style="${b.length>6?'font-size:16px':''}">${b}</b></div>`).join('');
  $('rTrials').innerHTML=(extra.trials||[]).map(x=>`<span class="${x.best?'best':''}${x.err?'err':''}">${x.v}</span>`).join('');
  $('rBadge').textContent='';
  $('rNote').textContent='ポイントは上位%（目安）から計算します。全国の順位はGame Centerの「今日のランキング」です。';
  $('bAgain').textContent=left>0?`もう一度挑戦（あと${left}回）`:'';$('bAgain').style.display=left>0?'':'none';
  showGcRank('pr_daily','今日');
  show('result');
  if(S.plays>=3&&(['SS','S','A'].includes(r.g)||isBest&&S.ch.tries>1))Native.requestReview();
}
// Game Centerの順位を結果画面に出す(取れないときは案内だけ)
function showGcRank(id,label){
  const el=$('rGc');
  if(!Native.isApp){el.innerHTML='🏆 アプリ版では全国ランキングに参加できます';return;}
  el.innerHTML='🏆 全国ランキングを読み込み中…';
  setTimeout(()=>Native.gcRank(id).then(x=>{
    if(!$('result').classList.contains('on'))return;
    el.innerHTML=x&&x.rank?`🏆 ${label} 全国 <b>${x.rank.toLocaleString()}位</b> / ${x.total.toLocaleString()}人 <a id="gcOpen">ランキングを見る ›</a>`
      :`🏆 <a id="gcOpen">Game Centerにサインインして全国ランキングに参加 ›</a>`;
    const a=$('gcOpen');if(a)a.onclick=()=>{sfx.tap();Native.gcShow(id);};
  }),900); // 送信が反映されるのを少し待つ
}
// 通常モードの記録は種目ごとの「全期間」ランキングへ(ありえない値は送らない)
function gcSubmitMode(m,v){
  const ok={simple:v>=120,gonogo:v>=150,color:v>=250,numbers:v>=4,hue:v>=1,memory:v>=1}[m];
  if(!ok)return;
  const score=m==='numbers'?Math.round(v*100):Math.round(v);
  Native.gcSubmit('pr_'+m,score);
}

/* ---------- 結果を画像にしてシェア ---------- */
function loadImg(src){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});}
async function resultImage(L,noMedal){
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const F='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP",sans-serif',N='"SF Pro Rounded","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a2442');g.addColorStop(1,'#0d1220');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.textAlign='center';x.fillStyle='#22d07a';x.beginPath();x.arc(W/2-250,120,16,0,7);x.fill();
  x.fillStyle='#f2f5fb';x.font=`800 54px ${F}`;x.fillText('ぽちっと反射神経',W/2+20,140);
  const M=MODES[L.m];let y=250;
  if(L.ch){x.fillStyle='#ffb020';x.font=`800 44px ${F}`;x.fillText(`今日のチャレンジ #${L.ch.no}（${dayLabel(L.ch.d)}）`,W/2,y);y+=70;}
  x.fillStyle='#8e9ab5';x.font=`700 46px ${F}`;x.fillText(M.name+(L.ch?'・'+L.ch.v.name:''),W/2,y);
  x.fillStyle='#f2f5fb';x.font=`900 190px ${N}`;const vs=fmt(L.m,L.v);x.fillText(vs,W/2-40,y+230);
  const vw=x.measureText(vs).width;x.textAlign='left';x.fillStyle='#8e9ab5';x.font=`800 64px ${F}`;x.fillText(M.unit,W/2-40+vw/2+14,y+230);x.textAlign='center';
  const medal=noMedal?null:await loadImg('img/rank_'+L.r.g.toLowerCase()+'.png');
  const my=y+300;if(medal)x.drawImage(medal,W/2-130,my,260,260);
  x.fillStyle=['SS','S'].includes(L.r.g)?'#3a2a00':'#fff';x.font=`900 96px ${N}`;x.fillText(L.r.g,W/2,my+(L.r.g==='SS'?175:165));
  x.fillStyle='#f2f5fb';x.font=`900 58px ${F}`;x.fillText(L.ch?L.pts.toLocaleString()+' ポイント':L.r.t,W/2,my+340);
  x.fillStyle='#8e9ab5';x.font=`700 44px ${F}`;x.fillText('上位 '+pctTxt(L.p)+'%（目安）'+(L.age!=null?'・反射神経年齢 '+L.age+'歳':''),W/2,my+410);
  x.fillStyle='#22d07a';x.font=`800 44px ${F}`;x.fillText(L.ch?'同じ問題で、あなたも挑戦！':'あなたは何'+M.unit+'？',W/2,H-110);
  x.fillStyle='#8e9ab5';x.font=`600 34px ${F}`;x.fillText('App Store「ぽちっと反射神経」',W/2,H-55);
  try{return c.toDataURL('image/png');}catch(e){if(!noMedal)return resultImage(L,true);throw e;} // 画像が使えない環境ではメダル無しで作る
}
async function shareResult(L){
  const M=MODES[L.m];
  let t=L.ch?`【ぽちっと反射神経】今日のチャレンジ #${L.ch.no}\n${M.name}・${L.ch.v.name}：${fmt(L.m,L.v)}${M.unit}（${L.pts.toLocaleString()}ポイント・${L.r.g}ランク）\n同じ問題で勝負しよう！ #ぽちっと反射神経`
    :`【ぽちっと反射神経】${M.name}：${fmt(L.m,L.v)}${M.unit}（${L.r.g}ランク・上位${pctTxt(L.p)}%）`+(L.age!=null?`\n反射神経年齢は ${L.age}歳 でした`:'')+`\nあなたは何${M.unit}？ #ぽちっと反射神経`;
  let img=null;try{img=await resultImage(L);}catch(e){}
  const handled=img?await Native.shareImage(img,t):false;
  if(!handled){if(img)showSharePreview(img,t);else Native.share(t);}
}
function showSharePreview(img,t){ // ブラウザで画像の共有ができないとき：画像を表示(長押しで保存)
  $('mTitle').textContent='シェア用の画像';$('mBody').innerHTML=`<img src="${img}" style="width:100%;border-radius:12px;display:block;margin-bottom:8px">画像を長押しで保存できます。`;
  const row=$('mRow');row.innerHTML='';const b=document.createElement('button');b.className='btn';b.textContent='文章をシェア';b.onclick=()=>{$('modal').classList.remove('on');Native.share(t);};row.appendChild(b);
  $('modal').classList.add('on');
}

/* ---------- ホームの「今日のチャレンジ」カード ---------- */
function renderChCard(){
  chSync();
  const c=todayCh(),M=MODES[c.v.m],left=CH_TRIES-S.ch.tries;
  const days=[];for(let k=6;k>=0;k--){const d=c.d-k;days.push({d,v:S.ch.log[d]});}
  const bars=days.map(x=>`<div class="cb"><i style="height:${x.v!=null?Math.max(8,Math.round(x.v/9990*100)):0}%"></i><span>${dayLabel(x.d).split('/')[1]}</span></div>`).join('');
  $('chCard').innerHTML=`<div class="chtop"><span class="chtag">今日のチャレンジ #${c.no}</span><span class="chday">${dayLabel(c.d)}・毎日0時に変わる</span></div>
    <div class="chmain"><div class="ic ${M.cls}"><img src="img/mode_${c.v.m}.png" alt=""></div><div><div class="t">${M.name}</div><div class="d">${c.v.name}${c.v.desc?'：'+c.v.desc:''}</div></div></div>
    <div class="chstat">${S.ch.best!=null?`今日のベスト <b>${S.ch.best.toLocaleString()}</b>pt`:'全員が同じ問題で、全国ランキングに挑戦'}${S.ch.streak>1&&S.ch.last>=c.d-1?`　🔥${S.ch.streak}日連続`:''}</div>
    <div class="chbars">${bars}</div>
    <div class="navrow"><button class="btn" id="bCh">${left>0?`挑戦する（あと${left}回）`:'今日は終わり・また明日'}</button><button class="btn ghost" id="bRank" style="flex:.55">🏆 ランキング</button></div>`;
  $('bCh').onclick=()=>{sfx.tap();startChallenge();};
  $('bRank').onclick=()=>{sfx.tap();if(!Native.isApp){modal('全国ランキング','アプリ版ではGame Centerの全国ランキング（今日のチャレンジ・種目ごと）を見られます。');return;}Native.gcShow('pr_daily');};
}

/* =========================================================
 *  RECORDS
 * ========================================================= */
let recMode='simple';
$('bGc').onclick=()=>{sfx.tap();if(!Native.isApp){modal('全国ランキング','アプリ版ではGame Centerで種目ごとの全国ランキングを見られます。');return;}Native.gcShow('pr_'+recMode);};
function openRecords(){renderRecords();show('records');}
function renderRecords(){
  $('recTabs').innerHTML=Object.keys(MODES).map(k=>`<button class="${k===recMode?'on':''}" data-k="${k}">${MODES[k].name}</button>`).join('');
  $('recTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{recMode=b.dataset.k;renderRecords();});
  const h=S.hist[recMode].slice(-20),M=MODES[recMode];
  if(h.length<2){$('chart').innerHTML=`<div class="empty">${h.length?'あと1回測るとグラフが出ます':'まだ記録がありません'}</div>`;}
  else{
    const W=320,H=150,P=24,vs=h.map(x=>x.v);
    let lo=Math.min(...vs),hi=Math.max(...vs);if(hi-lo<1e-6){hi+=1;lo-=1;}const pad_=(hi-lo)*.15;lo-=pad_;hi+=pad_;
    const X=i=>P+(W-P-8)*i/(h.length-1),Y=v=>M.hi?8+(H-30)*(hi-v)/(hi-lo):8+(H-30)*(v-lo)/(hi-lo); // 良い値ほど上に描く
    const pts=vs.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    const bi=vs.indexOf(M.hi?Math.max(...vs):Math.min(...vs));
    $('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="${P}" y1="${H-20}" x2="${W-8}" y2="${H-20}" stroke="#2a3552"/>
      <text x="2" y="14" fill="#8e9ab5" font-size="10">${M.hi?'高い':'速い'}</text><text x="2" y="${H-24}" fill="#8e9ab5" font-size="10">${M.hi?'低い':'遅い'}</text>
      <polyline points="${pts}" fill="none" stroke="#22d07a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${vs.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i===bi?4.5:2.5}" fill="${i===bi?'#ffd166':'#22d07a'}"/>`).join('')}
      <text x="${W-8}" y="${H-5}" fill="#8e9ab5" font-size="10" text-anchor="end">直近${h.length}回</text>
    </svg>`;
  }
  const all=S.hist[recMode].map(x=>x.v);
  const avg=all.length?all.reduce((a,b)=>a+b,0)/all.length:null;
  $('recStats').innerHTML=[
    ['自己ベスト',S.best[recMode]!=null?fmt(recMode,S.best[recMode])+M.unit:'—'],
    ['平均（直近'+all.length+'回）',avg!=null?(M.hi?avg.toFixed(1):fmt(recMode,avg))+M.unit:'—'],
    ['プレイ回数',all.length+'回'],
    [recMode==='simple'?'1回のベスト':'ランク',recMode==='simple'?(S.bestTrial!=null?Math.round(S.bestTrial)+'ms':'—'):(S.best[recMode]!=null?rankOf(topPct(recMode,S.best[recMode]),recMode).g:'—')],
  ].map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('');
  $('badges').innerHTML=BADGES.map(b=>`<div class="badge ${S.badges[b.id]?'got':''}"><div class="e"><img src="img/badge_${b.id}.png" alt=""></div><div class="n">${b.n}</div><div class="c">${b.c}</div></div>`).join('');
}
